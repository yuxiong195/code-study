spring:
  datasource:
    url: jdbc:mysql://localhost:3306/your_database?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC
    username: your_username
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.codestudy.model
  configuration:
    map-underscore-to-camel-case: true
